<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Order Summary Component</title>
  </head>
  <body>
    <div class="container">
      <img class="card-img" src="Music_Flatline.svg" alt="card-img" />

      <div class="sub-container">
        <h1 class="card-title">Order Summary</h1>
        <p class="card-desc">
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </p>
        <div class="price-container">
          <div class="img-bc-color">
            <img src="Path.svg" alt="music-logo" />
          </div>
          <div class="plan-container">
            <h2 class="plan-title">Annual Plan</h2>
            <p class="plan-price">$59.99/year</p>
          </div>
          <a class="plan-change">Change</a>
        </div>
        <button class="btn-proceed">Proceed to Payment</button>
        <button class="btn-cancel">Cancel Order</button>
      </div>

</html>
